@if (!isOpen()) {
<div class="fixed top-0 right-0 left-0 z-50 flex h-16 items-center bg-primary-100 px-4 shadow-md sm:hidden">
	<button
		type="button"
		(click)="toggle()"
		class="inline-flex cursor-pointer items-center justify-center rounded-full p-2 transition hover:bg-black/5"
	>
		<span class="material-icons text-primary-900">menu</span>
	</button>
	<div class="absolute left-1/2 flex -translate-x-1/2 items-center gap-2">
		<img src="/images/logo.svg" alt="Novaventa" class="h-8 w-8 rounded-md" />
		<span class="text-lg font-bold text-primary-900">Novaventa</span>
	</div>
</div>
} @if (isOpen()) {
<button
	type="button"
	aria-label="Close menu"
	class="fixed inset-0 z-40 cursor-default bg-black/40 sm:hidden"
	(click)="toggle()"
></button>
}

<aside
	class="fixed inset-y-0 left-0 z-50 flex h-full flex-col bg-primary-100 transition-all sm:static sm:shadow-md"
	[class]="asideClasses()"
>
	<div class="flex h-16 shrink-0 items-center gap-2 px-4" [class]="isOpen() ? 'justify-start' : 'justify-center'">
		<button
			type="button"
			(click)="toggle()"
			class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-full p-2 transition hover:bg-black/5"
		>
			<span class="material-icons text-primary-900">menu</span>
		</button>
		@if (isOpen()) {
		<div class="flex items-center gap-2 overflow-hidden">
			<img src="/images/logo.svg" alt="Novaventa" class="h-8 w-8 shrink-0 rounded-md" />
			<span class="truncate text-lg font-bold text-primary-900">Novaventa</span>
		</div>
		}
	</div>

	<nav class="flex-1 overflow-y-auto px-3 py-4">
		@for (module of modules; track module.route) {
		<a
			[routerLink]="module.route"
			routerLinkActive="bg-primary-200"
			(click)="onModuleClick()"
			class="mb-1 flex items-center gap-3 rounded-lg px-3 py-2.5 text-primary-900 transition hover:bg-black/5"
			[class]="isOpen() ? 'justify-start' : 'justify-center'"
		>
			<span class="material-icons shrink-0">{{ module.icon }}</span>
			@if (isOpen()) {
			<span class="truncate text-base font-semibold">{{ module.labelKey | translate }}</span>
			}
		</a>
		}
	</nav>

	<div
		class="flex items-center gap-1 border-t border-black/10 px-3 py-4"
		[class]="isOpen() ? 'flex-row' : 'flex-col'"
	>
		<app-language-menu-molecule variant="sidebar" (openChange)="isLanguageMenuOpen.set($event)" />
		<button
			type="button"
			(click)="logout()"
			class="flex flex-1 cursor-pointer items-center justify-center gap-3 rounded-full text-primary-900 transition hover:bg-black/5"
			[class]="isOpen() ? 'px-3 py-2.5 justify-start' : 'p-2'"
		>
			<span class="material-icons shrink-0">logout</span>
			@if (isOpen()) {
			<span class="truncate text-base font-semibold">{{ 'shared.logout' | translate }}</span>
			}
		</button>
	</div>
</aside>
