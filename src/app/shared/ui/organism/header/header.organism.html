<header
	class="sticky top-0 z-50 flex h-16 items-center justify-between border-b-2 border-accent-400 bg-primary-100 px-6 shadow-sm"
>
	<a routerLink="/" class="text-xl font-bold tracking-wide text-primary-900">Novaventa</a>
	@if (isLandingPage()) {
	<nav class="hidden items-center gap-6 sm:flex">
		@for (link of landingNavLinks; track link.id) {
		<a
			[href]="'#' + link.id"
			class="text-sm font-semibold text-primary-800 transition-colors hover:text-primary-600"
		>
			{{ link.labelKey | translate }}
		</a>
		}
	</nav>
	}
	<app-language-menu-molecule />
</header>
