<div class="relative">
	<app-icon-button-atom icon="language" color="primary-container" (click)="toggleMenu()" />
	@if (isOpen()) {
	<div class="absolute z-10 min-w-32 rounded-lg bg-white py-1 shadow-lg" [class]="menuPositionClasses()">
		@for (language of languages; track language) {
		<button
			type="button"
			class="block w-full cursor-pointer px-4 py-2 text-left text-base text-neutral-800 hover:bg-secondary-50"
			(click)="changeLang(language)"
		>
			{{ `shared.languages.${language}` | translate }}
		</button>
		}
	</div>
	}
</div>
