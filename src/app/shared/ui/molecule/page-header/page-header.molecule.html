<div class="flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-center">
	<div>
		<div class="flex items-center gap-1">
			<h1 class="text-3xl font-bold text-black">{{ title() }}</h1>
			@if (helpText()) {
			<app-icon-button-atom icon="help_outline" color="surface" [attr.title]="helpText()" />
			}
		</div>
		@if (description()) {
		<p class="mt-1 text-neutral-600">{{ description() }}</p>
		}
	</div>
	<div class="shrink-0">
		<ng-content />
	</div>
</div>
