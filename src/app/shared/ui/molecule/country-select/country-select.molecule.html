<div class="relative">
	<button
		type="button"
		class="flex w-full items-center gap-2 rounded-lg border border-neutral-300 px-4 py-2.5 text-left text-black focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none disabled:cursor-not-allowed disabled:bg-neutral-100"
		[disabled]="isDisabled()"
		(click)="toggle()"
	>
		@if (selectedCountry(); as country) {
		<img
			[src]="flagUrl(country.countryCode)"
			[alt]="country.countryName"
			class="h-5 w-5 shrink-0 rounded-full object-cover"
		/>
		<span>+{{ country.phoneCode }}</span>
		} @else {
		<span class="text-neutral-400">{{ 'shared.countrySelect.placeholder' | translate }}</span>
		}
	</button>

	@if (isOpen()) {
	<button type="button" aria-label="Close" class="fixed inset-0 z-40 cursor-default" (click)="close()"></button>
	<div class="absolute z-50 mt-1 w-72 max-w-[90vw] rounded-lg bg-white py-2 shadow-lg">
		<div class="px-2 pb-2">
			<input
				type="text"
				[value]="search()"
				(input)="onSearchInput($any($event.target).value)"
				[placeholder]="'shared.countrySelect.searchPlaceholder' | translate"
				autocomplete="off"
				class="w-full rounded-lg border border-neutral-300 px-3 py-1.5 text-sm text-black focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none"
			/>
		</div>
		<div class="max-h-60 overflow-y-auto">
			@for (country of filteredCountries(); track country.countryCode) {
			<button
				type="button"
				class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-left text-sm text-neutral-800 hover:bg-secondary-50"
				(click)="select(country)"
			>
				<img
					[src]="flagUrl(country.countryCode)"
					[alt]="country.countryName"
					class="h-5 w-5 shrink-0 rounded-full object-cover"
				/>
				<span class="flex-1 truncate">{{ country.countryName }}</span>
				<span class="shrink-0 text-neutral-500">+{{ country.phoneCode }}</span>
			</button>
			} @empty {
			<p class="px-4 py-2 text-sm text-neutral-500">{{ 'shared.countrySelect.empty' | translate }}</p>
			}
		</div>
	</div>
	}
</div>
