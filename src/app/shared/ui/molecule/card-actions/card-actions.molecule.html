@if (useDropdown()) {
<div class="relative">
	<app-icon-button-atom icon="more_vert" color="primary" variant="filled" (click)="toggle()" />
	@if (isOpen()) {
	<button type="button" aria-label="Close" class="fixed inset-0 z-40 cursor-default" (click)="close()"></button>
	<div class="absolute right-0 z-50 mt-1 min-w-40 rounded-lg bg-white py-1 shadow-lg">
		@for (action of actions(); track action.labelKey) {
		<button
			type="button"
			class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-left text-sm text-neutral-800 hover:bg-secondary-50"
			(click)="trigger(action)"
		>
			<span class="material-icons text-lg">{{ action.icon }}</span>
			<span>{{ action.labelKey | translate }}</span>
		</button>
		}
	</div>
	}
</div>
} @else {
<div class="flex items-center gap-2">
	@for (action of actions(); track action.labelKey) {
	<app-icon-button-atom
		[icon]="action.icon"
		color="primary"
		variant="filled"
		[attr.title]="action.labelKey | translate"
		(click)="action.onClick()"
	/>
	}
</div>
}
