<div class="flex min-h-0 flex-1 flex-col bg-white p-6">
	<div class="border-b border-neutral-200 pb-6 shadow-[0_4px_6px_-6px_rgba(0,0,0,0.3)]">
		<app-page-header-molecule
			[title]="'notifications.list.title' | translate"
			[description]="'notifications.list.description' | translate"
		/>
	</div>

	<div class="flex min-h-0 flex-1 flex-col py-6">
		<div class="hidden sm:block">
			<app-notification-table-molecule
				[notifications]="notifications()"
				[pageSize]="pageSize"
				[isLoading]="isLoading()"
			>
				<app-paginator-organism
					footer
					[page]="page()"
					[totalPages]="totalPages()"
					(pageChange)="onPageChange($event)"
				/>
			</app-notification-table-molecule>
		</div>
		<div class="flex min-h-0 flex-1 flex-col gap-3 sm:hidden">
			@if (isLoading()) {
			<div class="flex flex-1 items-center justify-center">
				<app-loading-spinner-atom />
			</div>
			} @else if (isEmpty()) {
			<div class="flex flex-1 items-center justify-center">
				<app-empty-notifications-molecule />
			</div>
			} @else { @for (notification of notifications(); track notification.notificationId) {
			<app-notification-card-molecule [notification]="notification" />
			} }
			<app-paginator-organism
				class="mt-3 mb-4 block"
				[page]="page()"
				[totalPages]="totalPages()"
				(pageChange)="onPageChange($event)"
			/>
		</div>
	</div>
</div>
