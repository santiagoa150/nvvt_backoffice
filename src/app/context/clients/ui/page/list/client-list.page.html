<div class="flex min-h-0 flex-1 flex-col bg-white p-6">
	<div class="border-b border-neutral-200 pb-6 shadow-[0_4px_6px_-6px_rgba(0,0,0,0.3)]">
		<app-page-header-molecule
			[title]="'clients.list.title' | translate"
			[description]="'clients.list.description' | translate"
		>
			<app-rounded-button-atom color="primary" (click)="isCreateModalOpen.set(true)">
				{{ 'clients.list.create' | translate }}
			</app-rounded-button-atom>
		</app-page-header-molecule>
	</div>

	<div class="flex min-h-0 flex-1 flex-col py-6">
		<div class="hidden sm:block">
			<app-client-table-molecule
				[clients]="clients()"
				[pageSize]="pageSize"
				[isLoading]="isLoading()"
				(deleteClient)="onDeleteRequested($event)"
			>
				<app-paginator-organism
					footer
					[page]="page()"
					[totalPages]="totalPages()"
					(pageChange)="onPageChange($event)"
				/>
			</app-client-table-molecule>
		</div>
		<div class="flex min-h-0 flex-1 flex-col gap-3 sm:hidden">
			@if (isLoading()) {
			<div class="flex flex-1 items-center justify-center">
				<app-loading-spinner-atom />
			</div>
			} @else if (isEmpty()) {
			<div class="flex flex-1 items-center justify-center">
				<app-empty-clients-molecule />
			</div>
			} @else { @for (client of clients(); track client.clientId) {
			<app-client-card-molecule [client]="client" (deleteClient)="onDeleteRequested($event)" />
			} }
			<app-paginator-organism
				class="mt-3 mb-4 block"
				[page]="page()"
				[totalPages]="totalPages()"
				(pageChange)="onPageChange($event)"
			/>
		</div>
	</div>
</div>

@if (isCreateModalOpen()) {
<app-create-client-modal-organism (created)="onClientCreated()" (dismiss)="isCreateModalOpen.set(false)" />
} @if (pendingDelete(); as client) {
<app-confirm-dialog-organism
	[title]="'clients.list.deleteConfirm.title' | translate"
	[message]="'clients.list.deleteConfirm.message' | translate: { name: client.fullName }"
	[confirmLabel]="'clients.list.deleteConfirm.confirm' | translate"
	[cancelLabel]="'clients.list.deleteConfirm.cancel' | translate"
	[isConfirming]="isDeleting()"
	(confirmed)="onDeleteConfirmed()"
	(dismiss)="onDeleteDismissed()"
>
	@if (deleteError()) {
	<p error class="mt-4 text-base text-primary-600">{{ deleteError()?.message }}</p>
	}
</app-confirm-dialog-organism>
}
