<div class="flex items-start justify-between gap-3 rounded-2xl border border-neutral-300 p-4">
	<div>
		<p class="text-lg font-bold text-black">{{ campaign().name }}</p>
		<p class="mt-1 text-sm text-neutral-600">
			{{ 'campaigns.list.table.year' | translate }}: {{ campaign().year }}
		</p>
		<p class="text-sm text-neutral-600">{{ 'campaigns.list.table.number' | translate }}: {{ campaign().number }}</p>
	</div>
	<app-icon-button-atom
		icon="add"
		color="primary"
		variant="filled"
		[attr.title]="'campaigns.list.viewAction' | translate"
	/>
</div>
