<div class="min-h-full bg-white p-6">
	<app-page-header-molecule
		[title]="'campaigns.list.title' | translate"
		[description]="'campaigns.list.description' | translate"
		[helpText]="'campaigns.list.help' | translate"
	>
		<app-rounded-button-atom color="primary"> {{ 'campaigns.list.create' | translate }} </app-rounded-button-atom>
	</app-page-header-molecule>

	<div class="mt-6">
		@if (isLoading()) {
		<p class="text-neutral-600">{{ 'campaigns.list.loading' | translate }}</p>
		} @else if (campaigns().length === 0) {
		<p class="text-neutral-600">{{ 'campaigns.list.empty' | translate }}</p>
		} @else {
		<div class="hidden sm:block">
			<app-campaign-table-molecule [campaigns]="campaigns()" />
		</div>
		<div class="flex flex-col gap-3 sm:hidden">
			@for (campaign of campaigns(); track campaign.campaignId) {
			<app-campaign-card-molecule [campaign]="campaign" />
			}
		</div>
		}
	</div>

	@if (totalPages() > 1) {
	<app-paginator-organism
		class="mt-6 block"
		[page]="page()"
		[totalPages]="totalPages()"
		(pageChange)="onPageChange($event)"
	/>
	}
</div>
