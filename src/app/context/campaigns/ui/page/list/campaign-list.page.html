<div class="flex min-h-0 flex-1 flex-col bg-white p-6">
	<div class="border-b border-neutral-200 pb-6 shadow-[0_4px_6px_-6px_rgba(0,0,0,0.3)]">
		<app-page-header-molecule
			[title]="'campaigns.list.title' | translate"
			[description]="'campaigns.list.description' | translate"
		>
			<app-rounded-button-atom color="primary">
				{{ 'campaigns.list.create' | translate }}
			</app-rounded-button-atom>
		</app-page-header-molecule>
	</div>

	<div class="flex min-h-0 flex-1 flex-col py-6">
		@if (!isLoading() && campaigns().length === 0) {
		<p class="text-neutral-600">{{ 'campaigns.list.empty' | translate }}</p>
		} @else {
		<div class="hidden sm:block">
			<app-campaign-table-molecule [campaigns]="campaigns()" [pageSize]="pageSize" [isLoading]="isLoading()">
				@if (totalPages() > 1) {
				<app-paginator-organism
					footer
					[page]="page()"
					[totalPages]="totalPages()"
					(pageChange)="onPageChange($event)"
				/>
				}
			</app-campaign-table-molecule>
		</div>
		<div class="flex flex-col gap-3 sm:hidden">
			@if (isLoading()) {
			<div class="flex min-h-40 flex-1 items-center justify-center">
				<app-loading-spinner-atom />
			</div>
			} @else { @for (campaign of campaigns(); track campaign.campaignId) {
			<app-campaign-card-molecule [campaign]="campaign" />
			} } @if (totalPages() > 1) {
			<app-paginator-organism
				class="mt-3 mb-4 block"
				[page]="page()"
				[totalPages]="totalPages()"
				(pageChange)="onPageChange($event)"
			/>
			}
		</div>
		}
	</div>
</div>
