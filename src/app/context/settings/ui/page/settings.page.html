<div class="flex min-h-0 flex-1 flex-col bg-white p-6">
	<div class="border-b border-neutral-200 pb-6 shadow-[0_4px_6px_-6px_rgba(0,0,0,0.3)]">
		<app-page-header-molecule
			[title]="'settings.title' | translate"
			[description]="'settings.description' | translate"
		/>
	</div>

	<div class="flex flex-1 flex-col items-center justify-center py-6">
		<div class="flex w-full max-w-md flex-col gap-6 rounded-2xl bg-primary-100 p-6 shadow-lg">
			<div class="flex flex-col gap-1.5">
				<label for="settings-provider-token" class="text-2xl font-bold text-neutral-800">
					{{ 'settings.providerToken.label' | translate }}
				</label>
				<p class="text-sm text-neutral-500">{{ 'settings.providerToken.description' | translate }}</p>
				<input
					id="settings-provider-token"
					type="text"
					autocomplete="off"
					[value]="providerToken()"
					(input)="onProviderTokenChange($any($event.target).value)"
					class="rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-black focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none"
				/>
			</div>

			<div class="flex flex-col gap-1.5">
				<label for="settings-cart-id" class="text-2xl font-bold text-neutral-800">
					{{ 'settings.cartId.label' | translate }}
				</label>
				<p class="text-sm text-neutral-500">{{ 'settings.cartId.description' | translate }}</p>
				<input
					id="settings-cart-id"
					type="text"
					autocomplete="off"
					[value]="cartId()"
					(input)="onCartIdChange($any($event.target).value)"
					class="rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-black focus:border-primary-500 focus:ring-2 focus:ring-primary-500/30 focus:outline-none"
				/>
			</div>
		</div>
	</div>
</div>
